<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALL-CODES ENTERPRISE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0b12;
            color: #f0f0f8;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            background: rgba(18, 18, 32, 0.7);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(224, 158, 54, 0.15);
            text-align: center;
        }
        h1 {
            font-size: 48px;
            color: #E09E36;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 30px;
        }
        .codes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .code-card {
            padding: 30px 40px;
            border-radius: 12px;
            min-width: 120px;
            color: #ffffff;
            font-weight: bold;
            font-size: 28px;
            transition: transform 0.3s;
            cursor: pointer;
        }
        .code-card:hover {
            transform: scale(1.05);
        }
        .gold { background: #E09E36; }
        .blue { background: #3603E0; }
        .dark-blue { background: #3903E0; }
        .details {
            color: #ffffff;
            font-size: 16px;
            margin-top: 30px;
            line-height: 2;
        }
        .details span { color: #E09E36; font-weight: bold; }
        .tagline {
            color: #888;
            font-size: 14px;
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 30px;
        }
        .footer {
            margin-top: 30px;
            color: #E09E36;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ALL-CODES ENTERPRISE</h1>
        <h2>Three Codes. Infinite Possibilities.</h2>

        <div class="codes">
            <div class="code-card gold">E09E</div>
            <div class="code-card blue">3603</div>
            <div class="code-card dark-blue">3903</div>
        </div>

        <div class="details">
            <p>🔴 <span>E09E</span> = Gold + 401 + Brand Identity</p>
            <p>🔵 <span>3603</span> = Blue + 429 + UI Design</p>
            <p>🟣 <span>3903</span> = Dark Blue + 403 + Security</p>
        </div>

        <div class="tagline">
            One System. Three Codes. Infinite Possibilities.<br>
            ALL-CODES ENTERPRISE
        </div>

        <div class="footer">
            Created by Jubril Aminu<br>
            📞 +234 810 620 7182
        </div>
    </div>
</body>
</html>
